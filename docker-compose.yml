services:
  postgres:
    image: postgres:15
    container_name: hr_ease_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_ease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hr_ease']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
